<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de cotizaciones · Sergio Escobar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#161a23;--mut:#667085;--ac:#1f6feb;--bd:#dde1e8}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f28;--tx:#eceef3;--mut:#9aa2b1;--ac:#4c8dff;--bd:#323846}}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{padding:16px 24px;font-weight:700;font-size:18px}
main{max-width:980px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
h2{margin:0 0 12px;font-size:16px}label{font-size:13px;color:var(--mut);font-weight:500;display:block;margin-bottom:3px}
input,select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}.mut{color:var(--mut);font-size:13px}.err{color:#d92d20;margin-top:8px}
.tot{text-align:right;font-size:18px;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<header>🔧 Panel de cotizaciones · <span style="font-weight:400;color:var(--mut)">Sergio Escobar</span></header>
<main>
<section id="login">
  <h2>Acceso</h2>
  <div class="row"><div style="flex:1;min-width:200px"><label>Clave del panel</label><input id="clave" type="password" onkeydown="if(event.key==='Enter')entrar()"></div><button onclick="entrar()">Entrar</button></div>
  <div class="err" id="err"></div>
</section>
<section id="lista" style="display:none">
  <h2>Solicitudes</h2>
  <div class="row" style="margin-bottom:10px"><div><label>Estado</label><select id="fest" onchange="pintarLista()"><option value="">Todos</option><option>Nuevo</option><option>Cotizado</option><option>Aprobado</option><option>Cerrado</option></select></div>
  <button class="s" onclick="cargar()">Actualizar</button><button class="s" onclick="excel()">Exportar a Excel</button></div>
  <div class="w"><table><thead><tr><th>ID</th><th>Fecha</th><th>Cliente</th><th>Vehículo</th><th>Entrega</th><th>Estado</th><th>Total</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
<section id="det" style="display:none"></section>
</main>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clp=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
let CLAVE='',CASOS=[],CUR=null;
async function entrar(){CLAVE=$('clave').value;await cargar(true)}
async function cargar(primera){
  if(!CONFIG.SHEETS_URL){$('err').textContent='Falta configurar SHEETS_URL en config.js';return}
  try{
    const d=await (await fetch(CONFIG.SHEETS_URL+'?accion=listar&clave='+encodeURIComponent(CLAVE))).json();
    if(d.error){$('err').textContent=d.error;return}
    CASOS=d.casos;$('login').style.display='none';$('lista').style.display='block';pintarLista();
  }catch(e){$('err').textContent='No se pudo conectar con la hoja de Google.'}
}
function pintarLista(){
  const f=$('fest').value;
  $('tb').innerHTML=CASOS.filter(c=>!f||c.estado===f).map(c=>`<tr class="c" onclick="abrir('${c.id}')"><td><b>${esc(c.id)}</b></td><td>${esc(c.fecha)}</td><td>${esc(c.cliente)}</td><td>${esc(c.marca+' '+c.modelo)}</td><td>${esc(c.entrega)}</td><td>${esc(c.estado)}</td><td>${c.total?clp(c.total):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Sin solicitudes.</td></tr>';
}
function abrir(id){
  CUR=CASOS.find(c=>c.id===id);const c=CUR;
  $('det').style.display='block';
  $('det').innerHTML=`<h2>${esc(c.id)} · ${esc(c.cliente)}</h2>
  <p class="mut">${esc(c.tel)} ${c.correo?'· '+esc(c.correo):''}<br>${esc(c.marca)} ${esc(c.modelo)} ${esc(c.anio)} ${c.patente?'· Patente '+esc(c.patente):''} ${c.vin?'· VIN '+esc(c.vin):''}<br>
  Tipo: ${esc(c.tipo)} · Entrega: ${esc(c.entrega)} ${esc(c.comuna)}${c.comentarios?'<br>Comentarios: '+esc(c.comentarios):''}
  ${c.fotos.length?'<br>Fotos: '+c.fotos.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">Foto '+(i+1)+'</a>').join(' · '):''}</p>
  <div class="w"><table><thead><tr><th>Repuesto</th><th>Código</th><th>Cant.</th><th>Precio unit. (IVA incl.)</th><th>Subtotal</th></tr></thead><tbody>
  ${c.items.map((i,k)=>`<tr><td>${esc(i.repuesto)}</td><td>${esc(i.codigo)}</td><td>${i.cantidad}</td><td><input type="number" min="0" class="p" data-k="${k}" value="${i.precio||''}" oninput="tot()" style="width:140px"></td><td class="sub">—</td></tr>`).join('')}
  </tbody></table></div>
  <div class="g" style="margin-top:12px"><div><label>Costo de despacho</label><input id="desp" type="number" min="0" value="${c.despacho||''}" oninput="tot()"></div>
  <div><label>Estado</label><select id="est">${['Nuevo','Cotizado','Aprobado','Cerrado'].map(e=>'<option'+(e===c.estado?' selected':'')+'>'+e+'</option>').join('')}</select></div></div>
  <div class="tot">Total: <span id="total">$0</span></div>
  <div class="row" style="margin-top:12px">${c.correo?'<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="notif" checked style="width:auto"> Avisar al cliente por correo (si el estado es Cotizado)</label>':''}</div>
  <div class="row" style="margin-top:12px"><button onclick="guardar()">Guardar</button><button class="s" onclick="pdf()">Ver / imprimir PDF</button><button class="s" onclick="$('det').style.display='none'">Cerrar</button></div>
  <div class="mut" id="msg" style="margin-top:8px"></div>`;
  tot();$('det').scrollIntoView({behavior:'smooth'});
}
function precios(){return [...document.querySelectorAll('.p')].map(i=>+i.value||0)}
function tot(){
  const p=precios();let t=+$('desp').value||0;
  document.querySelectorAll('.sub').forEach((td,k)=>{const s=p[k]*CUR.items[k].cantidad;td.textContent=s?clp(s):'—';t+=s});
  $('total').textContent=clp(t);return t;
}
async function guardar(){
  const p=precios();let est=$('est').value;
  if(est==='Nuevo'&&p.some(x=>x>0)){est='Cotizado';$('est').value=est}
  try{
    await fetch(CONFIG.SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:'cotizar',clave:CLAVE,id:CUR.id,estado:est,despacho:+$('desp').value||0,precios:p,notificar:!!($('notif')&&$('notif').checked)})});
    $('msg').textContent='Guardado. Actualizando…';setTimeout(async()=>{await cargar();abrir(CUR.id);$('msg').textContent='Guardado ✔'},2500);
  }catch(e){$('msg').textContent='No se pudo guardar.'}
}
function pdf(){
  const c=CUR,p=precios(),d=+$('desp').value||0,logo=new URL('logo.png',location.href).href,t=tot();
  const venc=new Date(Date.now()+(CONFIG.VALIDEZ_DIAS||5)*864e5).toLocaleDateString('es-CL');
  const w=window.open('','_blank');
  w.document.write(`<html><head><meta charset="utf-8"><title>Cotización ${esc(c.id)}</title><style>body{font-family:Inter,Arial,sans-serif;max-width:760px;margin:30px auto;color:#161a23}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}td.r,th.r{text-align:right}.top{display:flex;justify-content:space-between;align-items:center}small{color:#667085}</style></head><body>
  <div class="top"><img src="${logo}" style="height:60px"><div style="text-align:right"><b>COTIZACIÓN ${esc(c.id)}</b><br><small>${new Date().toLocaleDateString('es-CL')}</small></div></div>
  <p><b>Cliente:</b> ${esc(c.cliente)} · ${esc(c.tel)}<br><b>Vehículo:</b> ${esc(c.marca)} ${esc(c.modelo)} ${esc(c.anio)} ${c.patente?'· '+esc(c.patente):''} ${c.vin?'· VIN '+esc(c.vin):''}<br><b>Tipo de repuesto:</b> ${esc(c.tipo)} · <b>Entrega:</b> ${esc(c.entrega)} ${esc(c.comuna)}</p>
  <table><tr><th>Repuesto</th><th>Código</th><th class="r">Cant.</th><th class="r">P. unitario</th><th class="r">Subtotal</th></tr>
  ${c.items.map((i,k)=>`<tr><td>${esc(i.repuesto)}</td><td>${esc(i.codigo)}</td><td class="r">${i.cantidad}</td><td class="r">${clp(p[k])}</td><td class="r">${clp(p[k]*i.cantidad)}</td></tr>`).join('')}
  ${d?`<tr><td colspan="4">Despacho</td><td class="r">${clp(d)}</td></tr>`:''}
  <tr><th colspan="4" class="r">TOTAL (IVA incluido)</th><th class="r">${clp(t)}</th></tr></table>
  <p><small>Cotización válida hasta el ${venc}. Sujeta a disponibilidad de stock.<br>${esc(CONFIG.NOMBRE)}</small></p>
  <script>window.onload=()=>setTimeout(()=>print(),400)<\/script></body></html>`);
  w.document.close();
}
function excel(){
  const filas=[];CASOS.forEach(c=>c.items.forEach(i=>filas.push({ID:c.id,Fecha:c.fecha,Estado:c.estado,Cliente:c.cliente,Teléfono:c.tel,Correo:c.correo,Marca:c.marca,Modelo:c.modelo,Año:c.anio,Patente:c.patente,VIN:c.vin,Tipo:c.tipo,Entrega:c.entrega,Comuna:c.comuna,Repuesto:i.repuesto,Código:i.codigo,Cantidad:i.cantidad,'Precio unitario':i.precio,'Total cotización':c.total})));
  if(!filas.length)return;const ws=XLSX.utils.json_to_sheet(filas),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Cotizaciones');XLSX.writeFile(wb,'cotizaciones_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
</script>
</body>
</html>
