<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador de Repuestos · Sergio Escobar</title>
<meta name="description" content="App web para cotizar repuestos de vehículos con registro automático y exportación a Excel.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ac:#1f6feb;--bd:#dfe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--tx:#e8eaf0;--mut:#98a0ae;--ac:#4c8dff;--bd:#333947}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 24px;font-size:20px;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
h2{margin:0 0 12px;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tot{text-align:right;margin-top:10px;line-height:1.6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
</style>
</head>
<body>
<header>🔧 Cotizador de Repuestos <span style="font-weight:400;color:var(--mut);font-size:14px">· Sergio Escobar</span></header>
<main>
<section>
  <h2>Nueva cotización</h2>
  <div class="g">
    <div><label>Cliente</label><input id="cli"></div>
    <div><label>Teléfono / Email</label><input id="tel"></div>
    <div><label>Marca</label><select id="marca" onchange="cargarModelos()"><option value="">Seleccionar…</option><option>Suzuki</option><option>Mazda</option><option>Renault</option><option>Great Wall (GWM)</option><option>Haval</option><option>Changan</option><option>DFSK</option></select></div>
    <div><label>Modelo</label><input id="modelo" list="modelos" placeholder="Elige o escribe"><datalist id="modelos"></datalist></div>
    <div><label>Año</label><input id="anio" type="number"></div>
    <div><label>Patente</label><input id="pat"></div>
    <div><label>Asignado a</label><input id="asig" value="Sergio Escobar" placeholder="Quién toma el caso"></div>
    <div><label>Estado</label><select id="est"><option>Nuevo</option><option>Cotizado</option><option>Aprobado</option><option>Cerrado</option></select></div>
  </div>
  <div class="w" style="margin-top:14px"><table>
    <thead><tr><th>Repuesto</th><th>Código</th><th>Proveedor</th><th>Cant.</th><th>Precio unit.</th><th>Subtotal</th><th></th></tr></thead>
    <tbody id="items"></tbody></table></div>
  <div class="bar"><button class="s" onclick="addRow()">+ Agregar repuesto</button></div>
  <div style="margin-top:10px"><label>Notas</label><textarea id="nota" rows="2"></textarea></div>
  <div class="tot">Neto: <b id="neto">$0</b> · IVA 19%: <b id="iva">$0</b> · Total: <b id="total">$0</b></div>
  <div class="bar"><button onclick="guardar()">Guardar cotización</button>
  <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="auto" style="width:auto" checked> Descargar Excel automáticamente al guardar</label></div>
</section>

<section>
  <h2>Registro de cotizaciones</h2>
  <div class="bar" style="margin:0 0 10px"><input id="q" placeholder="Buscar por cliente, patente, ID..." oninput="render()" style="max-width:320px"><button onclick="exportar()">Exportar todo a Excel</button></div>
  <div class="w"><table>
    <thead><tr><th>ID</th><th>Fecha</th><th>Cliente</th><th>Vehículo</th><th>Patente</th><th>Asignado</th><th>Estado</th><th>Total</th><th></th></tr></thead>
    <tbody id="lista"></tbody></table></div>
</section>
</main>
<footer style="text-align:center;color:var(--mut);font-size:13px;padding:0 16px 24px">Herramienta de cotización preparada para <b>Sergio Escobar</b></footer>
<script>
const $=id=>document.getElementById(id), fmt=n=>'$'+Math.round(n).toLocaleString('es-CL');
let regs=[];
try{regs=JSON.parse(localStorage.getItem('cot')||'[]')}catch(e){}
const persist=()=>{try{localStorage.setItem('cot',JSON.stringify(regs))}catch(e){}};

function addRow(){
  const tr=document.createElement('tr');
  tr.innerHTML='<td><input class="d"></td><td><input class="c"></td><td><input class="p"></td><td><input class="q" type="number" value="1" min="1" style="width:70px"></td><td><input class="u" type="number" value="0" min="0" style="width:110px"></td><td class="st">$0</td><td><button class="s" onclick="this.closest(\'tr\').remove();calc()">✕</button></td>';
  tr.addEventListener('input',calc);$('items').appendChild(tr);
}
function leerItems(){
  return [...$('items').rows].map(r=>({
    repuesto:r.querySelector('.d').value.trim(),codigo:r.querySelector('.c').value.trim(),
    proveedor:r.querySelector('.p').value.trim(),cant:+r.querySelector('.q').value||0,
    precio:+r.querySelector('.u').value||0})).filter(i=>i.repuesto);
}
function calc(){
  let n=0;[...$('items').rows].forEach(r=>{
    const s=(+r.querySelector('.q').value||0)*(+r.querySelector('.u').value||0);
    r.querySelector('.st').textContent=fmt(s);n+=s;});
  $('neto').textContent=fmt(n);$('iva').textContent=fmt(n*.19);$('total').textContent=fmt(n*1.19);
}
function guardar(){
  const items=leerItems();
  if(!$('cli').value.trim()||!items.length){alert('Ingresa el cliente y al menos un repuesto.');return}
  const neto=items.reduce((a,i)=>a+i.cant*i.precio,0);
  const n=regs.length?Math.max(...regs.map(r=>+r.id.split('-')[1]))+1:1;
  const r={id:'COT-'+String(n).padStart(4,'0'),fecha:new Date().toLocaleString('es-CL'),
    cliente:$('cli').value.trim(),contacto:$('tel').value.trim(),marca:$('marca').value.trim(),
    modelo:$('modelo').value.trim(),anio:$('anio').value,patente:$('pat').value.trim().toUpperCase(),
    asignado:$('asig').value.trim(),estado:$('est').value,notas:$('nota').value.trim(),items,neto,total:neto*1.19};
  regs.unshift(r);persist();
  if($('auto').checked)exportar([r],r.id);
  ['cli','tel','marca','modelo','anio','pat','nota'].forEach(i=>$(i).value='');$('asig').value='Sergio Escobar';
  $('items').innerHTML='';addRow();calc();cargarModelos();render();
}
function cambiarEstado(id,v){regs.find(r=>r.id===id).estado=v;persist()}
function cambiarAsig(id,v){regs.find(r=>r.id===id).asignado=v;persist()}
function borrar(id){if(confirm('¿Eliminar '+id+'?')){regs=regs.filter(r=>r.id!==id);persist();render()}}
function exportar(lista=regs,nombre='cotizaciones'){
  if(!lista.length){alert('No hay registros.');return}
  const filas=[];
  lista.forEach(r=>r.items.forEach(i=>filas.push({
    ID:r.id,Fecha:r.fecha,Cliente:r.cliente,Contacto:r.contacto,Marca:r.marca,Modelo:r.modelo,Año:r.anio,
    Patente:r.patente,Estado:r.estado,'Asignado a':r.asignado,Repuesto:i.repuesto,Código:i.codigo,
    Proveedor:i.proveedor,Cantidad:i.cant,'Precio unitario':i.precio,Subtotal:i.cant*i.precio,
    'Total cotización (c/IVA)':Math.round(r.total),Notas:r.notas})));
  const ws=XLSX.utils.json_to_sheet(filas),wb=XLSX.utils.book_new();
  ws['!cols']=Object.keys(filas[0]).map(k=>({wch:Math.max(k.length,14)}));
  XLSX.utils.book_append_sheet(wb,ws,'Cotizaciones');
  XLSX.writeFile(wb,nombre+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function render(){
  const q=$('q').value.toLowerCase();
  $('lista').innerHTML=regs.filter(r=>(r.id+r.cliente+r.patente+r.marca+r.modelo).toLowerCase().includes(q)).map(r=>`<tr>
    <td>${r.id}</td><td>${r.fecha}</td><td>${esc(r.cliente)}</td><td>${esc(r.marca+' '+r.modelo+' '+r.anio)}</td><td>${esc(r.patente)}</td>
    <td><input value="${esc(r.asignado)}" onchange="cambiarAsig('${r.id}',this.value)" style="width:120px"></td>
    <td><select onchange="cambiarEstado('${r.id}',this.value)">${['Nuevo','Cotizado','Aprobado','Cerrado'].map(e=>`<option ${e===r.estado?'selected':''}>${e}</option>`).join('')}</select></td>
    <td>${fmt(r.total)}</td>
    <td><button class="s" onclick="exportar([regs.find(x=>x.id==='${r.id}')],'${r.id}')">Excel</button> <button class="s" onclick="borrar('${r.id}')">✕</button></td></tr>`).join('')
    ||'<tr><td colspan="9" style="color:var(--mut)">Sin registros aún.</td></tr>';
}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODELOS={
'Suzuki':['Alto','Alto 800','Celerio','Swift','Swift Sport','Baleno','Ignis','Dzire','S-Presso','Splash','SX4','SX4 S-Cross','S-Cross','Vitara','Grand Vitara','Jimny','Fronx','Ertiga','XL7','APV','Carry','Every','Wagon R','Liana','Kizashi','Samurai','Maruti'],
'Mazda':['Mazda2','Mazda3','Mazda3 Sport','Mazda5','Mazda6','CX-3','CX-30','CX-5','CX-50','CX-60','CX-7','CX-8','CX-9','BT-50','MX-5','MX-30','Tribute','323','626','Allegro'],
'Renault':['Kwid','Kwid E-Tech','Clio','Symbol','Logan','Sandero','Stepway','Duster','Duster Oroch','Oroch','Captur','Kardian','Arkana','Koleos','Fluence','Megane','Scenic','Twingo','Kangoo','Trafic','Master','Alaskan','Talisman','Zoe','Express','Boreal','Austral','Laguna','R19'],
'Great Wall (GWM)':['Wingle 5','Wingle 6','Wingle 7','Poer','Cannon','Steed','Deer','Voleex C10','Voleex C20R','Hover H3','Hover H5','M4','Florid','Coolbear','Tank 300','Tank 500','Ora 03','Ora'],
'Haval':['Jolion','Jolion Pro','Jolion HEV','H6','H6 GT','H6 HEV','H6 PHEV','Dargo','H9','H2','H1','H7'],
'Changan':['Alsvin','Eado','Benni','CS15','CS35','CS35 Plus','CS55 Plus','CS55 Plus IDD','CS75','CS75 Plus','CS95','UNI-T','UNI-K','UNI-V','S5','X7 Plus','Deepal S07','Deepal SL03','Hunter','Hunter Reev','M201','Honor','Star Truck','Star Van'],
'DFSK':['Glory 330','Glory 500','Glory 560','Glory 580','Glory 600','Fengon 5','Fengon 500','Fengon 580','K01','K01S','K02','K05','K05S','K07','K07S','C31','C32','C35','C37','V21','V22','V27','V29','EC35','E5']};
function cargarModelos(){$('modelos').innerHTML=(MODELOS[$('marca').value]||[]).map(m=>'<option value="'+m+'">').join('')}
addRow();render();
</script>
</body>
</html>
